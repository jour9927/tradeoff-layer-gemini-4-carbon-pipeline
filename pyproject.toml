[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradeoff-layer-pipeline"
version = "1.0.0"
description = "Unattended AI Video & Shorts Production Pipeline for @TradeoffLayer (Web Scraper + Citations + AI Script + PyTorch Voice Cloning + AI Visuals + 60fps Compositor)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "soundfile>=0.12",
    "scipy>=1.11",
    "pyloudnorm>=0.1.1",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
gpu = [
    "f5-tts",
    "faster-whisper",
    "diffusers",
    "transformers",
    "accelerate",
    "safetensors",
]

[project.scripts]
tradeoff-pipeline = "tradeoff_pipeline.orchestrator:main"

[tool.setuptools.packages.find]
where = ["src"]
