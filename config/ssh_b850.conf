# Tailscale SSH configuration for Tradeoff Layer b850 permanent worker node
Host b850 b850-ubuntu
    HostName 100.100.230.119
    User alan-eagle
    IdentityFile ~/.ssh/id_ed25519
    IdentitiesOnly yes
    StrictHostKeyChecking accept-new
    ConnectTimeout 8
    ServerAliveInterval 30
    ServerAliveCountMax 3
